name: Deploy Ocean Guide to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build static site
        env:
          GITHUB_PAGES: "true"
        run: pnpm run build
      - name: Normalize static output
        run: |
          html=$(find dist/client -name index.html -type f | head -n 1)
          if [ -z "$html" ]; then html=$(find dist/client -name '*.html' -type f | head -n 1); fi
          if [ -n "$html" ]; then
            folder=$(dirname "$html")
            if [ "$folder" != "dist/client" ]; then cp -R "$folder"/. dist/client/; fi
          fi
          sed -i -E 's#(href|src)="/#\1="/ocean-guide-busan/#g' dist/client/index.html
          sed -i 's#/ocean-guide-busan/assets/#__BASE_ASSETS__#g; s#/assets/#/ocean-guide-busan/assets/#g; s#__BASE_ASSETS__#/ocean-guide-busan/assets/#g' dist/client/index.html
          find dist/client/assets -type f \( -name '*.js' -o -name '*.css' \) -exec sed -i 's#/ocean-guide-busan/assets/#__BASE_ASSETS__#g; s#/assets/#/ocean-guide-busan/assets/#g; s#"assets/#"/ocean-guide-busan/assets/#g; s#__BASE_ASSETS__#/ocean-guide-busan/assets/#g' {} +
          sed -i -E 's#(\.js|\.css)("|\))#\1?v=13\2#g' dist/client/index.html
          find dist/client/assets -type f \( -name '*.js' -o -name '*.css' \) -exec sed -i -E 's#(\.js|\.css)("|\))#\1?v=13\2#g' {} +
          test -f dist/client/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
